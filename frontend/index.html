    <title>映创 · AI 图片、视频与短剧创作</title>
    <script>
      (function () {
        var themes = ['daylight', 'studio']
        var theme = 'daylight'
        try {
          var saved = localStorage.getItem('kk-site-theme')
          if (themes.indexOf(saved) >= 0) theme = saved
        } catch (e) {}
        var preview = new URLSearchParams(location.search).get('preview_theme')
        if (themes.indexOf(preview) >= 0) theme = preview
        document.documentElement.dataset.theme = theme
      })()
    </script>
